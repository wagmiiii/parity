[project]
name = "parity"
version = "0.1.0"
description = "Audit and repair of identity-based treatment gaps in small multilingual LLMs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "auditkit>=1.1.0",
    "curatorkit>=0.1.0",
    "safetune>=0.1.0",
    "transformers>=5.15.0",
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "rich>=13.0.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.16.0",
    "accelerate>=0.28.0",
]

[project.scripts]
parity = "parity.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
space = [
    "gradio>=4.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parity"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # unused arguments
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (typer.Option)
    "ARG001", # unused function arguments in interface stubs / CLI commands
    "ARG002", # unused method arguments in interface stubs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "gpu: opt-in tests that require a GPU",
    "slow: tests that take more than 5 seconds",
]
